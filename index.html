const GridCell = memo(({ r, c, cell, isSelected, isEditing, isExporting, rowHeight, onMouseDown, onMouseEnter, onDoubleClick, onBlur }) => {
const divRef = useRef(null);
const [isOverflow, setIsOverflow] = useState(false);

useEffect(() => {
if (divRef.current) setIsOverflow(divRef.current.scrollHeight > rowHeight);
}, [isEditing, rowHeight, cell.text]);

useEffect(() => {
if (isEditing && divRef.current && document.activeElement !== divRef.current) {
divRef.current.focus();
if (typeof window.getSelection !== "undefined" && typeof document.createRange !== "undefined") {
const range = document.createRange();
range.selectNodeContents(divRef.current);
range.collapse(false);
const sel = window.getSelection();
sel.removeAllRanges();
sel.addRange(range);
}
}
}, [isEditing]);

const handleCellPaste = useCallback((e) => {
  e.stopPropagation();
  e.preventDefault();
  
  const clipboardData = e.clipboardData || window.clipboardData;
  if (!clipboardData) return;

  const items = clipboardData.items;
  let hasImage = false;

  let savedRange = null;
  const selection = window.getSelection();
  if (selection.rangeCount > 0) {
    savedRange = selection.getRangeAt(0).cloneRange();
  }

  if (items) {
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        hasImage = true;
        const blob = items[i].getAsFile();
        if (!blob) continue;

        const reader = new FileReader();
        reader.onload = (event) => {
          if (savedRange) {
            selection.removeAllRanges();
            selection.addRange(savedRange);
          }
          const imgHtml = `<img src="${event.target.result}" class="pasted-cell-image" style="max-width: 100%; max-height: 150px; height: auto; display: inline-block; vertical-align: bottom;" />`;
          document.execCommand('insertHTML', false, imgHtml);
          selection.collapseToEnd();
        };
        reader.readAsDataURL(blob);
        break;
      }
    }
  }

  if (!hasImage) {
    const text = clipboardData.getData('text/plain');
    if (text) {
      document.execCommand('insertText', false, text);
    }
  }
}, []);

let textDeco = 'none';
const hasUnderline = cell.underline || cell.underlineOffset;
if (hasUnderline && cell.strikethrough) textDeco = 'underline line-through'; else if (hasUnderline) textDeco = 'underline'; else if (cell.strikethrough) textDeco = 'line-through';
const getBStyle = (b) => { if (!b) return isExporting ? '1px solid transparent' : '1px solid #e2e8f0'; if (b === true || b === -1 || b === 1 || b === 2) return '1px solid #000'; return `${b}px solid #000`; };

return (
        <td rowSpan={cell.rowSpan} colSpan={cell.colSpan}
        onMouseDown={(e) => onMouseDown(e, r, c)}
        onMouseEnter={() => onMouseEnter(r, c)}
        onDoubleClick={() => onDoubleClick(r, c)}
        className={`row-${r} ${isSelected && !isExporting ? 'cell-selected' : ''}`}
        style={{
        height: `${rowHeight}px`,
        borderTop: getBStyle(cell.borders.t), borderRight: getBStyle(cell.borders.r), borderBottom: getBStyle(cell.borders.b), borderLeft: getBStyle(cell.borders.l),
        padding: '2px',
        position: 'relative',
        color: '#000000',
        backgroundColor: isEditing ? '#eff6ff' : ((cell.bgColor && cell.bgColor !== 'transparent') ? cell.bgColor : (cell.errorMsg && !isExporting ? 'rgba(254, 226, 226, 0.8)' : (isOverflow && !isExporting && !isEditing ? 'rgba(254, 226, 226, 0.5)' : 'transparent'))),
        outline: cell.errorMsg && !isExporting ? '3px solid #ef4444' : 'none',
        outlineOffset: '-3px',
        verticalAlign: cell.vAlign === 'top' ? 'top' : cell.vAlign === 'bottom' ? 'bottom' : 'middle',
        cursor: isEditing ? 'text' : 'cell',
        boxSizing: 'border-box',
        overflow: isExporting ? 'visible' : 'hidden' // 変更: 出力時は隠さない
        }}
        title={cell.errorMsg && !isExporting ? cell.errorMsg : (isOverflow && !isExporting ? "⚠️ 文字が隠れています！" : "")}
        >
        {cell.errorMsg && !isExporting && <div className="absolute top-0 right-0 bg-red-600 text-white w-5 h-5 rounded-bl-full flex items-center justify-center text-[12px] shadow font-bold z-10 cursor-help" title={cell.errorMsg}>⚠️</div>}
         <div
          ref={divRef}
          id={!isEditing ? `cell-${r}-${c}` : undefined}
          className={`cell-inner-${r}`}
          contentEditable={isEditing}
          suppressContentEditableWarning={isEditing}
          onBlur={isEditing ? (e) => onBlur(r, c, e.target.innerHTML) : undefined}
          onPaste={isEditing ? handleCellPaste : undefined}
            style={{
            width: '100%', 
            maxHeight: (isEditing || isExporting) ? 'none' : `${Math.max(0, rowHeight)}px`, // 変更: -4を削除し、出力時は制限解除
            outline: 'none', 
            whiteSpace: 'pre-wrap', 
            wordBreak: 'break-all', // 変更: break-word から break-all に変更
            overflowWrap: 'break-word', // 追加
            fontWeight: cell.bold ? 'bold' : 'normal', 
            textDecoration: textDeco, 
            textAlign: cell.align,
            fontSize: `${cell.fontSize || 14}px`, 
            color: cell.color || '#000000',
            textUnderlineOffset: cell.underlineOffset ? '6px' : 'auto',
            overflow: (isEditing || isExporting) ? 'visible' : 'hidden', // 変更: 出力時はみ出しを許可
            lineHeight: '1.5',
            letterSpacing: '0.5px', // 追加: html2canvasの文字重なりバグ対策
            fontVariantLigatures: 'none', // 追加: リガチャによる重なり防止
            fontFeatureSettings: '"palt" 0' // 追加: プロポーショナルメトリクス無効化
          }}
          dangerouslySetInnerHTML={{ __html: cell.text }}
        />
        </td>
        );
}, (prev, next) => prev.r === next.r && prev.c === next.c && prev.cell === next.cell && prev.isSelected === next.isSelected && prev.isEditing === next.isEditing && prev.isExporting === next.isExporting && prev.rowHeight === next.rowHeight);

// ★修正：DOMの座標計算をやめ、純粋なデータ（列幅・行高）から座標を割り出す完全同期版
const SelectionOverlay = ({ r1, r2, c1, c2, colWidths, rowHeights, startRow }) => {
  let leftOffset = 40;
  for (let i = 0; i < c1; i++) leftOffset += colWidths[i] || 40;
  
  let boxWidth = 0;
  for (let i = c1; i <= c2; i++) boxWidth += colWidths[i] || 40;
  
  let topOffset = 25; // <thead>の高さ
  for (let i = startRow; i < r1; i++) topOffset += rowHeights[i] || 25;
  
  let boxHeight = 0;
  for (let i = r1; i <= r2; i++) boxHeight += rowHeights[i] || 25;

  return (
    <div style={{
      position: 'absolute',
      left: `${leftOffset}px`,
      top: `${topOffset}px`,
      width: `${boxWidth}px`,
      height: `${boxHeight}px`,
      backgroundColor: 'rgba(59, 130, 246, 0.28)',
      outline: '2px solid #3b82f6',
      outlineOffset: '-2px',
      pointerEvents: 'none',
      zIndex: 20
    }} />
  );
};
const App = () => {
  // ★追加：リセットまでの残り時間を計算する関数（JST 16時/17時基準）
  const getHoursUntilReset = () => {
    const now = new Date();
    // 簡易的な夏時間判定（3月〜10月を夏時間とする）
    const isSummerTime = now.getMonth() >= 2 && now.getMonth() <= 9; 
    const resetHour = isSummerTime ? 16 : 17;
    
    let resetTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), resetHour, 0, 0);
    // 現在時刻がリセット時刻を過ぎている場合は、翌日のリセット時刻にする
    if (now > resetTime) {
      resetTime.setDate(resetTime.getDate() + 1);
    }
    const diffMs = resetTime - now;
    return Math.ceil(diffMs / (1000 * 60 * 60)); // 切り上げで残り時間を算出
  };

  const handleApiError = (error) => {
    if (error.name === 'AbortError') return;
    const errMsg = error.message || "";
    
    if (errMsg.includes('429') || errMsg.toLowerCase().includes('quota') || errMsg.includes('Too Many Requests') || errMsg.includes('QUOTA_EXCEEDED')) {
      // alert() の代わりに showToast() を使って画面を固めないようにする
      showToast(`🚨 【API制限】1分間の連投制限、または1日の上限です。少し待ってからお試しください。`);
    } else {
      showToast("⚠️ エラーが発生しました: " + errMsg);
    }
  };
const [isToolPaletteVisible, setIsToolPaletteVisible] = useState(true);
const [toolPalettePos, setToolPalettePos] = useState({ x: window.innerWidth > 800 ? window.innerWidth - 200 : 20, y: 120 });
const toolPaletteDragStartRef = useRef({ x: 0, y: 0 });
const toolPaletteMoveRafRef = useRef(null);
const handleToolPaletteMouseDown = (e) => {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  toolPaletteDragStartRef.current = { x: e.clientX - toolPalettePos.x, y: e.clientY - toolPalettePos.y };
  document.addEventListener('mousemove', handleToolPaletteMouseMove);
  document.addEventListener('mouseup', handleToolPaletteMouseUp);
};
const handleToolPaletteMouseMove = (e) => {
  if (toolPaletteMoveRafRef.current) cancelAnimationFrame(toolPaletteMoveRafRef.current);
  toolPaletteMoveRafRef.current = requestAnimationFrame(() => {
    setToolPalettePos({ x: e.clientX - toolPaletteDragStartRef.current.x, y: e.clientY - toolPaletteDragStartRef.current.y });
  });
};
const handleToolPaletteMouseUp = () => {
  if (toolPaletteMoveRafRef.current) cancelAnimationFrame(toolPaletteMoveRafRef.current);
  document.removeEventListener('mousemove', handleToolPaletteMouseMove);
  document.removeEventListener('mouseup', handleToolPaletteMouseUp);
};

const [contextMenu, setContextMenu] = useState(null);

// UI State
const [editMode, setEditMode] = useState('table'); // 'table' | 'pack'
const [isLeftDrawerOpen, setIsLeftDrawerOpen] = useState(false);
const [isListModalOpen, setIsListModalOpen] = useState(false);

// ★追加：ファイル名管理
const [currentFileName, setCurrentFileName] = useState("無題のファイル");
const [floatingImages, setFloatingImages] = useState([]); // ★自由に動かせる画像

const [stampProfile, setStampProfile] = useState(() => {
  try { return JSON.parse(localStorage.getItem('tl_stamp_profile')) || { title: '行政書士', name: '', address: '', imageUrl: '' }; }

});

const handleStampImageUpload = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;
        let hasContent = false;

        for (let y = 0; y < canvas.height; y++) {
          for (let x = 0; x < canvas.width; x++) {
            const i = (y * canvas.width + x) * 4;
            const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
            
            // 明るさを計算して、白っぽい背景（影やスキャンノイズ）を完全に無視します
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            if (a > 10 && brightness < 240) {
              if (x < minX) minX = x;
              if (y < minY) minY = y;
              if (x > maxX) maxX = x;
              if (y > maxY) maxY = y;
              hasContent = true;
            }
          }
        }

        if (hasContent) {
          const padding = 2;
          minX = Math.max(0, minX - padding);
          minY = Math.max(0, minY - padding);
          maxX = Math.min(canvas.width - 1, maxX + padding);
          maxY = Math.min(canvas.height - 1, maxY + padding);

          const cropWidth = maxX - minX + 1;
          const cropHeight = maxY - minY + 1;
          const cropCanvas = document.createElement('canvas');
          cropCanvas.width = cropWidth;
          cropCanvas.height = cropHeight;
          const cropCtx = cropCanvas.getContext('2d');
          cropCtx.drawImage(canvas, minX, minY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
          setStampProfile(prev => ({ ...prev, imageUrl: cropCanvas.toDataURL('image/png') }));
        } else {
          setStampProfile(prev => ({ ...prev, imageUrl: evt.target.result }));
        }
      } catch (err) {
        console.error("Crop error:", err);
        setStampProfile(prev => ({ ...prev, imageUrl: evt.target.result }));
      }
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
};

const getStampHtml = () => {
  const dateStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
  return `<table style="width: 420px; border: 1px solid #000; border-collapse: collapse; background-color: #ffffff; color: #000000; font-family: 'MS Mincho', 'ＭＳ 明朝', serif; font-size: 10px; line-height: 1.2; margin: 0; padding: 0; table-layout: fixed;">

        </td>

const copyStampToClipboard = async () => {
  try {
    const stampHtml = getStampHtml();
    const plainText = `【 翻訳証明書 】\nDate: ${new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' })}\n${stampProfile.title || '行政書士'}　${stampProfile.name || '（名前未登録）'}\n本職は、別添書類が原本の正確な和訳であることを証明する。\n住所：${stampProfile.address || '（住所未登録）'}`;
    
    if (navigator.clipboard && window.ClipboardItem) {
      const htmlBlob = new Blob([stampHtml], { type: "text/html" });
      const textBlob = new Blob([plainText], { type: "text/plain" });
      await navigator.clipboard.write([
        new ClipboardItem({
          "text/html": htmlBlob,
          "text/plain": textBlob
        })
      ]);
      showToast("📋 証明書全体をコピーしました！エクセル等に貼り付けられます");
    } else {
      // フォールバック
      const tempDiv = document.createElement("div");
      tempDiv.contentEditable = true;
      tempDiv.innerHTML = stampHtml;
      tempDiv.style.position = "fixed";
      tempDiv.style.left = "-9999px";
      tempDiv.style.top = "0";
      document.body.appendChild(tempDiv);
      
      const range = document.createRange();
      range.selectNodeContents(tempDiv);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      
      document.execCommand("copy");
      
      selection.removeAllRanges();
      document.body.removeChild(tempDiv);
      showToast("📋 証明書全体をコピーしました！");
    }
    setIsStampModalOpen(false);
  } catch (error) {
    showToast("⚠️ コピー失敗: " + error.message);
  }
};

    // ★ここにあった safeModel = 'gemini-2.0-flash' を削除！
    // ユーザーがメニューで選んだモデル（modelNameRef.current）をそのまま使います
    for (let i = 0; i < maxRetries; i++) { 
      try { 
        const url = typeof urlBuilder === 'function' ? urlBuilder(modelNameRef.current) : urlBuilder;
        const response = await fetch(url, options); 
        if (!response.ok) { 
          const errorData = await response.json().catch(() => ({})); 
          const errMsg = errorData.error?.message || `HTTP error! status: ${response.status}`;
          
          // ★ 429 (クォータ超過) ならリトライせずに専用エラーを投げる
          if (response.status === 429) {
             throw new Error(`QUOTA_EXCEEDED: ${errMsg}`);
          }
          throw new Error(errMsg); 
        } 
        return response; 
      } catch (error) { 
        if (error.name === 'AbortError') throw error; 
        if (error.message && error.message.includes('API key')) throw error;
        if (error.message && error.message.includes('QUOTA_EXCEEDED')) throw error; // ★クォータ超過は即終了
        
        if (i === maxRetries - 1) throw error; 
        showToast(`⚠️ 通信エラー。\n${delayMs / 1000}秒後に再試行... (${i + 1}/${maxRetries})`); 
        await new Promise(resolve => setTimeout(resolve, delayMs)); 
      } 
    } 
  };

      const { rows, cols, colRatios, rowRatios, data } = parsed;

      if (!rows || !cols || !data) {
        throw new Error("JSONの形式が正しくありません。rows, cols, dataが必要です。");
      }

      let newCols = Array(cols).fill(40);
      if (colRatios && colRatios.length === cols) {
        const totalRatio = colRatios.reduce((a, b) => a + b, 0);
        if (totalRatio > 0) {
          newCols = colRatios.map(r => Math.max(2, Math.floor((r / totalRatio) * guideBox.w)));
        }
      } else {
        const equalWidth = Math.max(2, Math.floor(guideBox.w / cols));
        newCols = Array(cols).fill(equalWidth);

      let newRows = Array(rows).fill(25);

      } else {
        const equalHeight = Math.max(2, Math.floor(guideBox.h / rows));

      const newGrid = {};

                <div className="flex bg-zinc-950 border border-zinc-700 rounded overflow-hidden shadow-sm h-9">
                  <button onClick={() => appendTextToCell('―')} className="flex-1 hover:bg-zinc-700 text-zinc-300 text-sm font-bold transition-colors border-r border-zinc-700 flex items-center justify-center" title="ダッシュ">―</button>
                  <button onClick={() => appendTextToCell('<span style="white-space: nowrap;">- - -</span>', true)} className="flex-1 hover:bg-zinc-700 text-zinc-300 text-sm font-bold transition-colors border-r border-zinc-700 flex items-center justify-center tracking-widest pt-1" title="長い点線">- - -</button>
                  <button onClick={() => appendTextToCell('〜')} className="flex-1 hover:bg-zinc-700 text-zinc-300 text-sm font-bold transition-colors flex items-center justify-center" title="から">〜</button>
                </div>
              </div>
            </div>

          </div>
        </div>
      )}

      {/* ズームハンドル */}
      {!isExporting && (
        <div onMouseDown={handleWorkspaceZoomStart} className="fixed bottom-8 right-8 w-14 h-14 bg-blue-600 rounded-full cursor-nwse-resize shadow-2xl border-4 border-white flex items-center justify-center text-white hover:scale-110 transition-all z-[9999]">
          <span className="text-3xl font-bold">⤡</span>
        </div>
      )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
