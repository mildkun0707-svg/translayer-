  if (!clipboardData) return;

  const items = clipboardData.items;
  let hasImage = false;

  let savedRange = null;
  const selection = window.getSelection();
  if (selection.rangeCount > 0) {
    savedRange = selection.getRangeAt(0).cloneRange();
  }

    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        hasImage = true;
        const blob = items[i].getAsFile();
        if (!blob) continue;

        const reader = new FileReader();
        reader.onload = (event) => {
          if (savedRange) {
            selection.removeAllRanges();
            selection.addRange(savedRange);

          selection.collapseToEnd();
        };
        reader.readAsDataURL(blob);

        throw new Error("AIからの応答が不正です");
      }
      
      buildGridFromData(extractedText);
      
    } catch (error) { 
        if (error.name !== 'AbortError') alert("自動レイアウト失敗: " + error.message); 
    } finally { 
        setProcessingStatus(''); abortControllerRef.current = null; 
    }
  };

  return (
    <div className="flex flex-col h-screen w-full bg-zinc-950 overflow-hidden">
      <div id="col-resize-guide" style={{ display: 'none', position: 'fixed', top: 0, bottom: 0, width: '1px', backgroundColor: '#3b82f6', zIndex: 9999, pointerEvents: 'none', borderLeft: '1px dashed #60a5fa' }} />
      <div id="row-resize-guide" style={{ display: 'none', position: 'fixed', left: 0, right: 0, height: '1px', backgroundColor: '#3b82f6', zIndex: 9999, pointerEvents: 'none', borderTop: '1px dashed #60a5fa' }} />
      
      <div className="w-full bg-zinc-950 border-b border-zinc-800 flex items-center justify-between px-3 py-1 z-50 shrink-0 h-8">
        <div className="flex items-center gap-3">
          <button onClick={() => setIsLeftDrawerOpen(true)} className="text-zinc-300 hover:text-white px-2 py-1 rounded hover:bg-zinc-800 transition-colors flex items-center gap-1">
            <span className="text-lg leading-none">≡</span>
            <span className="text-xs font-bold">メニュー</span>
          </button>
          <div className="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 tracking-tight text-sm">TransLayer</div>
        </div>
        <div className="flex items-center bg-zinc-900 rounded-full p-0.5 shadow-inner border border-zinc-800">
          <button onClick={() => handleTabClick('table')} className={`px-3 py-0.5 rounded-full text-xs font-bold transition-all ${editMode === 'table' ? 'bg-blue-600 text-white shadow' : 'text-zinc-400 hover:text-zinc-200'}`}>📊 表モード</button>
          <button onClick={() => handleTabClick('pack')} className={`px-3 py-0.5 rounded-full text-xs font-bold transition-all ${editMode === 'pack' ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow' : 'text-zinc-400 hover:text-zinc-200'}`}>📦 提出パック</button>
        </div>
       <div className="flex justify-end items-center gap-3">
          {extractedList.length > 0 && (
            <div className="flex items-center gap-2">
              <button
                onClick={() => setIsAIPanelHidden(prev => !prev)}
                className="relative bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow transition-colors flex items-center gap-1.5 whitespace-nowrap"
                title="作業パネルを開閉"
              >
                📝 作業パネル
              </button>
              <button
                onClick={() => setIsReviewDashboardOpen(true)}
                className="relative bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow transition-colors flex items-center gap-1.5 whitespace-nowrap"
                title="審査ダッシュボードを開く"
              >
                🏆 審査ダッシュボード
                <span className="bg-white text-amber-700 text-[10px] font-black rounded-full px-2 py-0.5 flex items-center justify-center leading-none">{extractedList.length}件</span>
              </button>
            </div>
          )}
          <div className="flex flex-col items-end">
            <span className="text-[8px] text-zinc-500 font-bold leading-none">API</span>
            <div className="w-12 h-1 bg-zinc-800 rounded-full overflow-hidden relative flex shadow-inner mt-0.5">
              <div className={`h-full ${batteryColor} transition-all duration-500`} style={{ width: `${apiPercentage}%` }}></div>
            </div>
          </div>
        </div>
      </div>

      {isLeftDrawerOpen && (
        <div className="fixed inset-0 bg-black/50 z-[90]" onClick={() => setIsLeftDrawerOpen(false)}></div>
      )}
      <div className={`fixed inset-y-0 left-0 w-64 bg-zinc-900 border-r border-zinc-800 z-[100] flex flex-col shadow-2xl transform transition-transform duration-300 ${isLeftDrawerOpen ? 'translate-x-0' : '-translate-x-full'}`}>
        <div className="flex items-center justify-between p-3 border-b border-zinc-800 shrink-0">
          <span className="font-bold text-zinc-200">⚙️ システム・設定</span>
          <button onClick={() => setIsLeftDrawerOpen(false)} className="text-zinc-400 hover:text-white text-xl">&times;</button>
        </div>
        <div className="flex-1 overflow-y-auto p-3 space-y-4 light-scrollbar">
          <div className="space-y-2">
            <div className="text-xs font-bold text-zinc-500">ファイル操作</div>
            <div className="grid grid-cols-1 gap-1">
              <button onClick={() => document.getElementById('fileInput').click()} className="bg-zinc-800 hover:bg-zinc-700 text-blue-400 text-xs py-1.5 rounded font-bold">📄 原本読込</button>
              <input id="fileInput" type="file" accept="application/pdf, image/jpeg, image/png, image/jpg" className="hidden" onChange={handleFileUpload} />
              <input id="projectInput" type="file" accept=".json" className="hidden" onChange={loadProject} />
            </div>
          </div>
          <div className="space-y-2">
            <div className="text-xs font-bold text-zinc-500">AI・API設定</div>
            <button onClick={() => setIsMemoryModalOpen(true)} className="w-full bg-zinc-800 hover:bg-zinc-700 text-indigo-300 text-xs py-1.5 rounded mb-1 font-bold">🧠 AI記憶</button>
            <input type="password" value={apiKey} onChange={e => updateApiKey(e.target.value)} onBlur={fetchAvailableModels} className="w-full bg-zinc-950 border border-zinc-700 rounded px-2 py-1 text-xs text-white mb-1" placeholder="API KEY" />
            <select 
  value={modelName} 
  onChange={(e) => updateModelName(e.target.value)} 
  className="w-full bg-zinc-700 text-white p-2 rounded text-sm outline-none border border-zinc-600 focus:border-blue-500"
>
  <option value="gemini-1.5-flash-latest">Gemini 1.5 Flash (画像OK・高速)</option>
  <option value="gemini-1.5-pro-latest">Gemini 1.5 Pro (画像OK・高精度)</option>
  <option value="gemini-2.0-flash">Gemini 2.0 Flash (最新・高速)</option>
  <option value="gemma-4-26b-a4b-it">Gemma 4 26B IT (最新・爆速)</option>
  <option value="gemma-2-9b-it">Gemma 2 9b (テキスト専用・軽量)</option>
  <option value="gemma-2-27b-it">Gemma 2 27b (テキスト専用・秀才)</option>
</select>
            
            <label className="flex items-center gap-1 text-[10px] text-zinc-400 cursor-pointer mt-2">
              <input type="checkbox" checked={isUnlimitedMode} onChange={(e) => updateUnlimitedMode(e.target.checked)} className="w-3 h-3 accent-blue-500" />
              無制限モード (制限時にFlashを自動切替)
            </label>

          </div>
          <div className="space-y-2">
            <div className="text-xs font-bold text-zinc-500">その他ツール</div>
            <div className="grid grid-cols-2 gap-1">
              <button onClick={copyFullCanvasImage} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs py-1.5 rounded">📸 全体画像</button>
              <button onClick={copyStrictPrompt} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs py-1.5 rounded">📋 指示書</button>
              <button onClick={() => { window.open('https://gemini.google.com/app', 'gemini_popup', 'width=600,height=800,left=' + (window.screenX + window.outerWidth - 600) + ',top=' + window.screenY); }} className="bg-zinc-800 hover:bg-zinc-700 text-blue-300 text-xs py-1.5 rounded">🌐 本家Gemini</button>
              <button onClick={copyFinalCheckPrompt} className="bg-zinc-800 hover:bg-zinc-700 text-emerald-300 text-xs py-1.5 rounded">📋 最終確認</button>
            </div>
            <div className="flex gap-1 mt-1">
              <input type="text" value={geminiInputText} onChange={(e) => setGeminiInputText(e.target.value)} placeholder="JSONをペースト" className="flex-1 bg-zinc-950 border border-zinc-700 rounded px-2 py-1 text-xs text-zinc-300 outline-none" />
              <button onClick={() => buildGridFromData(geminiInputText)} disabled={!geminiInputText.trim()} className="bg-emerald-600 hover:bg-emerald-500 disabled:bg-zinc-800 text-white px-2 py-1 rounded text-xs font-bold">🏗️ 展開</button>
            </div>
          </div>
          <div className="space-y-2">
            <div className="text-xs font-bold text-zinc-500">背景設定</div>
            <div className="bg-zinc-950 p-2 rounded border border-zinc-800 space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-[10px] text-zinc-400">透明度</span>
                <input type="range" min="0" max="1" step="0.1" value={bgOpacity} onChange={(e) => setBgOpacity(parseFloat(e.target.value))} className="w-24 accent-blue-500 h-1" />
              </div>
              <div className="flex items-center justify-between">
                <span className="text-[10px] text-zinc-400">サイズ</span>
                <div className="flex items-center gap-1">
                  <button onClick={() => setTraceBgWidth(w => Math.max(200, w - 10))} className="px-1 bg-zinc-800 rounded text-zinc-400 text-[10px]">-</button>
                  <span className="w-8 text-center text-[10px] text-zinc-300">{Math.round((traceBgWidth / 794) * 100)}%</span>
                  <button onClick={() => setTraceBgWidth(w => w + 10)} className="px-1 bg-zinc-800 rounded text-zinc-400 text-[10px]">-</button>
                </div>
              </div>
              <div className="flex items-center justify-between">
                <span className="text-[10px] text-zinc-400">位置 (X, Y)</span>
                <div className="flex items-center gap-1">
                  <input type="number" value={bgOffsetX} onChange={e => setBgOffsetX(Number(e.target.value))} className="w-10 text-[10px] text-center bg-zinc-900 border border-zinc-700 rounded outline-none text-zinc-300 py-0.5" />
                  <input type="number" value={bgOffsetY} onChange={e => setBgOffsetY(Number(e.target.value))} className="w-10 text-[10px] text-center bg-zinc-900 border border-zinc-700 rounded outline-none text-zinc-300 py-0.5" />
                </div>
              </div>
             <label className="flex items-center gap-1 text-[10px] text-zinc-400 cursor-pointer mt-2">
                <input type="checkbox" checked={exportBg} onChange={(e) => setExportBg(e.target.checked)} className="w-3 h-3 accent-blue-500" />
                PDF出力時に背景を残す
              </label>
            </div>
          </div>
          
          {/* ▼ 追加：アカウント・法務情報セクション ▼ */}
          <div className="space-y-2 mt-4 pt-4 border-t border-zinc-800">
            <div className="text-xs font-bold text-zinc-500">アカウント・法務情報</div>
            <div className="flex flex-col gap-1">
              <a href="pricing.html" className="text-left bg-gradient-to-r from-blue-900/50 to-indigo-900/50 hover:from-blue-600 hover:to-indigo-600 text-blue-200 text-xs py-2 px-3 rounded font-bold transition-colors border border-blue-800/50">💎 料金プラン・アップグレード</a>
              <a href="terms.html" className="text-left bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-[10px] py-1.5 px-3 rounded transition-colors">📄 利用規約</a>
              <a href="tokushoho.html" className="text-left bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-[10px] py-1.5 px-3 rounded transition-colors">⚖️ 特定商取引法に基づく表記</a>
            </div>
          </div>
          {/* ▲ 追加ここまで ▲ */}

        </div>
      </div>

      {editMode === 'pack' ? (
        <div className="flex-1 flex bg-zinc-900 overflow-hidden">
          <div className="w-1/3 min-w-[300px] max-w-[400px] border-r border-zinc-800 bg-zinc-950 p-6 flex flex-col gap-6 overflow-y-auto light-scrollbar">
            <h2 className="text-xl font-bold text-white flex items-center gap-2">📦 提出パック作成</h2>
            
            <div className="space-y-3 bg-zinc-900 p-4 rounded-lg border border-zinc-800">
              <h3 className="text-sm font-bold text-emerald-400 border-b border-zinc-800 pb-2">📄 書類情報</h3>
              <div>
                <label className="block text-xs text-zinc-400 mb-1">翻訳する書類名</label>
                <input type="text" value={packData.documentName || ''} onChange={e => setPackData({...packData, documentName: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded px-3 py-2 text-sm text-white outline-none focus:border-emerald-500" placeholder="例: 住民票、成績証明書 など" />
              </div>
            </div>
            <div className="space-y-3 bg-zinc-900 p-4 rounded-lg border border-zinc-800">
              <h3 className="text-sm font-bold text-blue-400 border-b border-zinc-800 pb-2">🗜️ 圧縮設定</h3>
              <div className="flex flex-col gap-2">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="compression" checked={packCompression === 0.7} onChange={() => setPackCompression(0.7)} className="accent-blue-500" />
                  <span className="text-sm text-zinc-300">標準 (70%) <span className="text-xs text-zinc-500">- 入管推奨</span></span>
                </label>
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="compression" checked={packCompression === 1.0} onChange={() => setPackCompression(1.0)} className="accent-blue-500" />
                  <span className="text-sm text-zinc-300">画質優先 (100%) <span className="text-xs text-zinc-500">- 容量大</span></span>
                </label>
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="compression" checked={packCompression === 0.5} onChange={() => setPackCompression(0.5)} className="accent-blue-500" />
                  <span className="text-sm text-zinc-300">極限圧縮 (50%) <span className="text-xs text-zinc-500">- 容量制限時</span></span>
                </label>
              </div>
            </div>

            <div className="space-y-3 bg-zinc-900 p-4 rounded-lg border border-zinc-800">
              <h3 className="text-sm font-bold text-yellow-400 border-b border-zinc-800 pb-2">📊 容量シミュレーター</h3>
              <div className="flex justify-between text-xs text-zinc-400">
                <span>原本PDF:</span>
                <span>{originalPdfBytes ? (originalPdfBytes.byteLength / (1024 * 1024)).toFixed(2) : 0} MB</span>
              </div>
              <div className="flex justify-between text-xs text-zinc-400">
                <span>翻訳データ (推測):</span>
                <span>{packCompression === 1.0 ? 3.5 : packCompression === 0.7 ? 1.5 : 0.8} MB</span>
              </div>
              <div className="flex justify-between text-sm font-bold text-white border-t border-zinc-800 pt-2 mt-2">
                <span>合計推測サイズ:</span>
                <span className={(parseFloat(originalPdfBytes ? (originalPdfBytes.byteLength / (1024 * 1024)).toFixed(2) : 0) + (packCompression === 1.0 ? 3.5 : packCompression === 0.7 ? 1.5 : 0.8) + 0.5) > 25 ? 'text-red-500' : 'text-emerald-500'}>
                  {(parseFloat(originalPdfBytes ? (originalPdfBytes.byteLength / (1024 * 1024)).toFixed(2) : 0) + (packCompression === 1.0 ? 3.5 : packCompression === 0.7 ? 1.5 : 0.8) + 0.5).toFixed(2)} MB
                </span>
              </div>
              {(parseFloat(originalPdfBytes ? (originalPdfBytes.byteLength / (1024 * 1024)).toFixed(2) : 0) + (packCompression === 1.0 ? 3.5 : packCompression === 0.7 ? 1.5 : 0.8) + 0.5) > 25 ? (
                <div className="text-xs text-red-400 mt-1">⚠️ 25MBを超過する可能性があります。極限圧縮をお試しください。</div>
              ) : (
                <div className="text-xs text-emerald-400 mt-1">✅ 25MB制限に対して安全なサイズです。</div>
              )}
            </div>

            <button onClick={generatePackPdf} className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-lg shadow-lg transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2 text-lg mt-auto shrink-0">
              📦 提出用PDFを出力
            </button>
          </div>

          <div className="flex-1 bg-zinc-800 p-8 overflow-y-auto flex flex-col items-center gap-8 light-scrollbar">
            <div className="w-full max-w-3xl flex items-center justify-between bg-zinc-900 p-4 rounded-xl border border-zinc-700 shadow-lg shrink-0">
              <div className="flex flex-col items-center gap-2 w-1/3">
                <div className="w-12 h-16 bg-white rounded shadow flex items-center justify-center text-2xl">📄</div>
                <span className="text-sm font-bold text-emerald-400">1. 表紙</span>
              </div>
              <div className="text-zinc-500 text-2xl">▶</div>
              <div className="flex flex-col items-center gap-2 w-1/3">
                <div className="w-12 h-16 bg-zinc-700 rounded shadow flex items-center justify-center text-2xl border border-zinc-500">📑</div>
                <span className="text-sm font-bold text-zinc-300">2. 原本 ({originalPdfBytes ? totalPages + 'ページ' : '未読込'})</span>
              </div>
              <div className="text-zinc-500 text-2xl">▶</div>
              <div className="flex flex-col items-center gap-2 w-1/3">
                <div className="w-12 h-16 bg-blue-100 rounded shadow flex items-center justify-center text-2xl border border-blue-300">📊</div>
                <span className="text-sm font-bold text-blue-400">3. 翻訳 ({Math.max(1, pdfBgImages.length)}ページ)</span>
              </div>
            </div>
          </div>
        </div>
      ) : (
        <div className="flex-1 flex min-h-0 relative">
          
          {isGuideLineVisible && (
            <div
              className="guide-line-container"
              style={{
                position: 'absolute',
                top: guideLineY - 10,
                left: 0,
                right: 0,
                height: '22px',
                zIndex: 9999,
                pointerEvents: 'auto',
                cursor: 'ns-resize',
                display: 'flex',
                alignItems: 'center'
              }}
              onMouseDown={(e) => {
                e.preventDefault();
                e.stopPropagation();
                const startY = e.clientY;
                const startGuideY = guideLineY;
                const onMouseMove = (moveEvent) => {
                  setGuideLineY(startGuideY + (moveEvent.clientY - startY));
                };
                const onMouseUp = () => {
                  document.removeEventListener('mousemove', onMouseMove);
                  document.removeEventListener('mouseup', onMouseUp);
                };
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
              }}
            >
              <div style={{ width: '100%', height: '2px', backgroundColor: '#ef4444', boxShadow: '0 0 4px rgba(239,68,68,0.5)', position: 'relative', pointerEvents: 'none' }}>
                <div 
                  style={{ 
                    position: 'absolute', 
                    right: '100px', 
                    top: '50%', 
                    transform: 'translateY(-50%)', 
                    width: '24px', 
                    height: '24px', 
                    backgroundColor: '#ef4444', 
                    borderRadius: '50%', 
                    display: 'flex', 
                    flexDirection: 'column', 
                    alignItems: 'center', 
                    justifyContent: 'center', 
                    gap: '3px', 
                    boxShadow: '0 2px 6px rgba(0,0,0,0.5)',
                    pointerEvents: 'none'
                  }}
                >
                  <div style={{ width: '14px', height: '2px', backgroundColor: '#fff' }} />
                  <div style={{ width: '14px', height: '2px', backgroundColor: '#fff' }} />
                </div>
              </div>
            </div>
          )}

          <div className="flex-1 flex flex-col min-w-0 relative border-r border-zinc-800 bg-zinc-950">
            
            <div className="flex flex-col bg-zinc-900 border-b border-zinc-800 shrink-0 z-50 relative">
              <div className="flex items-center gap-2 px-2 h-11 border-b border-zinc-800/50">
                <div className="flex bg-zinc-950 border border-zinc-700 rounded overflow-hidden shadow-sm">
               <button onClick={generatePdfPreview} className="bg-red-900/40 hover:bg-red-800 text-red-300 px-3 py-1 text-[10px] font-bold border-r border-zinc-700 transition-colors flex items-center gap-1"><span>📄</span> PDF</button>
                  <button onClick={exportToExcel} className="bg-emerald-900/40 hover:bg-emerald-800 text-emerald-300 px-3 py-1 text-[10px] font-bold border-r border-zinc-700 transition-colors flex items-center gap-1"><span>📊</span> Excel</button>
                  <button onClick={exportToWord} className="bg-blue-900/40 hover:bg-blue-800 text-blue-300 px-3 py-1 text-[10px] font-bold transition-colors flex items-center gap-1"><span>📝</span> Word</button>
                </div>
                <button onClick={() => setIsPreviewOpen(!isPreviewOpen)} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded text-[10px] font-bold ml-2">👁️ 原本確認</button>
                <button onClick={() => document.getElementById('projectInput').click()} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded text-[10px] font-bold">📂 ロード</button>
                <button onClick={saveProject} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded text-[10px] font-bold">💾 セーブ</button>
              </div>
              <div className="flex items-center gap-2 px-2 h-11">
                <button onClick={toggleScreenshotMode} className={`px-2 py-1 rounded text-[10px] font-bold flex items-center gap-1 transition-colors ${actionMode === 'screenshot' ? 'bg-emerald-600 text-white' : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-300'}`}>📸 スクショ</button>
                <button onClick={toggleSniperMode} className={`px-2 py-1 rounded text-[10px] font-bold flex items-center gap-1 transition-colors ${actionMode === 'sniper' ? 'bg-rose-600 text-white' : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-300'}`}>🎯 スナイパー</button>
                
                <div className="flex items-center gap-1 ml-1 border-l border-zinc-700 pl-2">
                  <select 
                    value={translationDirection} 
                    onChange={(e) => setTranslationDirection(e.target.value)}
                    className="bg-zinc-800 border border-zinc-700 text-zinc-300 text-[10px] font-bold rounded px-2 py-1 outline-none cursor-pointer hover:bg-zinc-700 transition-colors"
                  >
                    <option value="to_ja">➡️ 日本語へ翻訳</option>
                    <option value="from_ja">⬅️ 外国語へ翻訳</option>
                  </select>
                  
                  <select 
                    value={targetCountry} 
                    onChange={(e) => setTargetCountry(e.target.value)}
                    className="bg-zinc-800 border border-zinc-700 text-zinc-300 text-[10px] font-bold rounded px-2 py-1 outline-none cursor-pointer hover:bg-zinc-700 transition-colors"
                  >
                    <option value="general">🌐 基本モード</option>
                    <option value="vietnam">🇻🇳 ベトナム特化</option>
                    <option value="germany">🇩🇪 ドイツ特化</option>
                    <option value="philippines">🇵🇭 フィリピン特化</option>
                    <option value="thailand">🇹🇭 タイ特化</option>
                  </select>

                                    let actualRowHeight = 0;

                          <div className="flex gap-1">
                            <button onClick={() => startEditMemory(m)} className="flex-1 bg-indigo-900/60 hover:bg-indigo-600 text-indigo-200 hover:text-white px-1 py-1.5 rounded text-[10px] font-bold transition-colors border border-indigo-800/50">編集</button>
                            <button onClick={() => removeMemory(m.id)} className="flex-1 bg-red-900/30 hover:bg-red-600 text-red-300 hover:text-white px-1 py-1.5 rounded text-[10px] font-bold transition-colors border border-red-800/30">削除</button>
                          </div>
                        </>
                      )}
                    </div>
                  </div>
                ))
              )}
            </div>
            <div className="p-4 border-t border-zinc-800 flex justify-between items-center bg-zinc-900/80">
              <span className="text-xs text-zinc-400 font-bold">合計: {memoryList?.length || 0} 件</span>
              <button onClick={() => setIsMemoryModalOpen(false)} className="bg-zinc-700 hover:bg-zinc-600 text-white px-6 py-2 rounded font-bold transition-colors text-sm shadow">閉じる</button>
            </div>
          </div>
        </div>
      )}

      {contextMenu && (
        <div className="fixed z-[10000] bg-zinc-800 border border-zinc-600 rounded-lg shadow-2xl py-2 min-w-[220px] overflow-hidden" style={{ left: contextMenu.x, top: contextMenu.y }}>
          {contextMenu.type === 'text' && (
            <>
              <button onClick={() => { navigator.clipboard.writeText(contextMenu.text); showToast("📋 コピーしました"); setContextMenu(null); }} className="w-full text-left px-4 py-2 text-sm text-zinc-200 hover:bg-zinc-700 transition-colors flex items-center gap-2">
                📋 コピー
              </button>
              <button onClick={() => { navigator.clipboard.writeText(contextMenu.text); document.execCommand('delete'); showToast("✂ 切り取りました"); setContextMenu(null); }} className="w-full text-left px-4 py-2 text-sm text-zinc-200 hover:bg-zinc-700 transition-colors flex items-center gap-2">
                ✂ 切り取り
              </button>
              <div className="w-full h-px bg-zinc-700 my-1"></div>
              <button onClick={() => {
                  window.open('https://gemini.google.com/app', '_blank', 'width=800,height=800,left=' + (window.screenX + window.outerWidth - 800) + ',top=' + window.screenY);
                  navigator.clipboard.writeText(contextMenu.text);
                  showToast("📋 コピーしました。本家Geminiに貼り付けてください");
                  setContextMenu(null);
                }} className="w-full text-left px-4 py-2 text-sm font-bold text-blue-300 hover:bg-blue-900/50 hover:text-blue-100 transition-colors flex items-center gap-2">
                🚀 本家Geminiを開いて投げる
              </button>
            </>
          )}
        </div>
      )}

     {isPdfPreviewOpen && (
        <div className="fixed inset-0 bg-black/90 z-[9999] flex flex-col items-center justify-center p-4 backdrop-blur-sm">
          <div className="w-full max-w-4xl flex justify-between items-center mb-4">
            <h2 className="text-xl font-bold text-white">📄 PDF出力プレビュー</h2>
            <div className="flex gap-3">
              <button onClick={() => setIsPdfPreviewOpen(false)} className="px-4 py-2 bg-zinc-700 hover:bg-zinc-600 text-white rounded font-bold transition-colors">キャンセル</button>
              <button onClick={downloadPdfFromPreview} className="px-6 py-2 bg-red-600 hover:bg-red-500 text-white rounded font-bold shadow-lg transition-colors flex items-center gap-2">
                <span>📥</span> ダウンロードを実行
              </button>
            </div>
          </div>
          <div className="flex-1 w-full max-w-4xl bg-zinc-800 rounded-lg overflow-y-auto p-4 flex flex-col gap-4 items-center light-scrollbar border border-zinc-700">
            {pdfPreviewImages.map((img, idx) => (
              <div key={idx} className="relative w-full max-w-[600px] bg-white shadow-2xl">
                <div className="absolute -left-8 top-0 text-zinc-500 font-bold">{idx + 1}</div>
                <img src={img} alt={`Page ${idx + 1}`} className="w-full h-auto" />
              </div>
            ))}
          </div>
        </div>
      )}

      {!isExporting && (
        <div onMouseDown={handleWorkspaceZoomStart} className="fixed bottom-8 right-8 w-14 h-14 bg-blue-600 rounded-full cursor-nwse-resize shadow-2xl border-4 border-white flex items-center justify-center text-white hover:scale-110 transition-all z-[9999]" title="ドラッグでズーム">
          <span className="text-3xl font-bold">⤡</span>
        </div>
      )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
